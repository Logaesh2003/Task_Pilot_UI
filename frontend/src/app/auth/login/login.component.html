<div class="login-container">
  <div class="login-card">
    <h1 class="title">Task GPT</h1>
    <p class="subtitle">Sign in to manage your day</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="you@example.com"
        />
        <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          Please enter a valid email
        </small>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
        />
        <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password must be at least 6 characters
        </small>
      </div>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Signing in...' : 'Login' }}
      </button>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <p class="footer-text">
      Don’t have an account?
      <a routerLink="/register">Create one</a>
    </p>
  </div>
</div>
