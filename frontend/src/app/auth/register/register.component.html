<div class="register-container">
  <div class="register-card">
    <h1 class="title">Create Account</h1>
    <p class="subtitle">Start organizing your tasks smarter</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Name</label>
        <input
          type="text"
          formControlName="name"
          placeholder="Your name"
        />
        <small *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.invalid">
          Name must be at least 2 characters
        </small>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="you@example.com"
        />
        <small *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
          Please enter a valid email
        </small>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
        />
        <small *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid">
          Password must be at least 6 characters
        </small>
      </div>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Creating account...' : 'Register' }}
      </button>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <p class="footer-text">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
