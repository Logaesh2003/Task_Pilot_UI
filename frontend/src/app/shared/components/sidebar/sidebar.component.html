<div class="sidebar" [class.collapsed]="collapsed">

  <div class="sidebar-header">
    <span class="title" *ngIf="!collapsed && expanded">Navigation</span>

    <!-- <button class="collapse-btn" (click)="toggle()">
      {{ collapsed ? '›' : '‹' }}
    </button> -->

    <div class="collapse-btn"  (click)="toggle()">
      <span class="chevron" [class.collapsed]="collapsed" >
      </span>
    </div>

  </div>

  

  <nav class="nav">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
    >
      <span class="icon">{{ item.icon }}</span>
      <span class="label" *ngIf = "expanded">{{ item.label }}</span>
    </a>
  </nav>

</div>
